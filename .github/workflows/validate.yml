name: validate-model

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate model
        run: python3 tools/almmodel.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate configuration and annexes
        run: |
          python3 tools/generate_polarion.py --lang fr
          python3 tools/generate_polarion.py --lang en
          python3 tools/generate_docs.py
          python3 tools/generate_project.py
      - name: Generated files must be committed and up to date
        run: git add -N generated docs/generated && git diff --exit-code -- generated docs/generated
