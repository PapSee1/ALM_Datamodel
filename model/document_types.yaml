# =============================================================================
#  Framatome SE / Polarion – Types de LiveDocs, champs de document et gabarits
# -----------------------------------------------------------------------------
#  Chaque type de document précise : types de Work Items autorisés, workflow
#  documentaire, signatures, et plan type (chapitres).
#   - primaryType   : type principal (doit figurer dans le profil de tailoring
#                     de toute typologie qui utilise le document) ;
#   - cascadeTypes  : types dont les actions 'submit' / 'approve' sont déclenchées
#                     en cascade par la soumission / l'approbation du document, et
#                     qui doivent être approuvés pour approuver le document ;
#   - approvalGate  : autres types dont les statuts admis à l'approbation du
#                     document sont listés explicitement.
#  Les gabarits réels sont
#  créés comme documents modèles dans le projet LIB-TEMPLATES puis réutilisés
#  (copie) à l'initialisation de chaque projet.
# =============================================================================

documentCustomFields:
  - {id: documentNumber,      type: string, fr: "N° de document", en: "Document number", required: true}
  - {id: revisionIndex,       type: string, fr: "Indice", en: "Revision index", required: true, desc: "A, B, C... (indice de diffusion) ; brouillons : A0, A1..."}
  - {id: customerVisa,        type: "enum:customerVisa", fr: "Visa client", en: "Customer visa"}
  - {id: customerDocumentNumber, type: string, fr: "N° document client", en: "Customer document number"}
  - {id: informationClassification, type: "enum:informationClassification", fr: "Classification", en: "Classification", required: true}
  - {id: exportControl,       type: "enum:exportControl", fr: "Contrôle export", en: "Export control", required: true}
  - {id: lifecyclePhase,      type: "enum:lifecyclePhase", fr: "Phase", en: "Phase"}
  - {id: language,            type: "enum:language", fr: "Langue", en: "Language"}
  - {id: aip,                 type: "enum:yesNoTbd", fr: "Produit d'une AIP", en: "Output of an AIP", required: true}
  - {id: applicablePlantSeries, type: "enum:plantSeries", multi: true, fr: "Paliers applicables", en: "Applicable plant series"}
  - {id: docAuthor,           type: user, fr: "Rédacteur", en: "Author"}
  - {id: docVerifier,         type: user, fr: "Vérificateur", en: "Verifier"}
  - {id: docApprover,         type: user, fr: "Approbateur", en: "Approver"}
  - {id: revisionSummary,     type: richtext, fr: "Objet de la révision", en: "Revision summary"}
  - {id: edmsReference,       type: string, fr: "Référence GED (archive)", en: "EDMS reference"}
  - {id: sourceTemplate,      type: string, fr: "Gabarit d'origine (version)", en: "Source template (version)"}
  - {id: transitionNote,      type: text, fr: "Motif de la dernière transition", en: "Last transition note"}
  - {id: requiredHabilitation, type: "enum:habilitationDomain", fr: "Habilitation requise des signataires", en: "Qualification required of signatories"}
  - {id: responsibleUnit,     type: "enum:operationalUnit", fr: "UO responsable", en: "Responsible unit"}

documentTypes:

  - id: stakeholderSpec
    fr: "Spécification technique de besoin (STB)"
    en: "Stakeholder requirements specification"
    workflow: wfDocumentFull
    allowedTypes: [stakeholderRequirement, sourceRequirement, operationalScenario, assumption, term]
    primaryType: stakeholderRequirement
    cascadeTypes: [stakeholderRequirement, operationalScenario]
    outline:
      - "1. Objet, domaine d'application, documents applicables et de référence"
      - "2. Contexte, parties prenantes, missions et cycle de vie du produit"
      - "3. Concept d'emploi (scénarios opérationnels, états d'exploitation)"
      - "4. Exigences de besoin par catégorie (fonctionnelles, performances, sûreté, RP, FOH, environnement, exploitabilité, maintenabilité, démantèlement)"
      - "5. Contraintes (réglementaires, interfaces, site, existant)"
      - "6. Hypothèses et données d'entrée"
      - "7. Critères de validation"
      - "Annexe : glossaire, matrice de traçabilité vers les exigences d'entrée"

  - id: systemSpec
    fr: "Spécification technique système / sous-système (ST)"
    en: "System / subsystem specification"
    workflow: wfDocumentFull
    allowedTypes: [systemRequirement, safetyRequirement, function, interface, designParameter, assumption]
    primaryType: systemRequirement
    cascadeTypes: [systemRequirement, safetyRequirement, function, designParameter]
    approvalGate: {interface: [agreed, frozen]}
    outline:
      - "1. Objet, périmètre, documents applicables"
      - "2. Description fonctionnelle (fonctions, modes, états)"
      - "3. Classement de sûreté et exigences associées"
      - "4. Exigences fonctionnelles et de performance"
      - "5. Exigences de sûreté (défaillance unique, redondance, diversité, séparation, alimentations secourues)"
      - "6. Exigences d'interface (renvoi ICD)"
      - "7. Exigences d'environnement, de qualification et sismiques"
      - "8. Exigences de RP, FOH, cybersécurité, exploitabilité, maintenabilité, inspectabilité, testabilité"
      - "9. Exigences de vérification (méthodes, étapes)"
      - "Annexes : paramètres de conception, traçabilité amont / aval"

  - id: systemDesignManual
    fr: "Dossier de conception système (SDM)"
    en: "System design manual"
    workflow: wfDocumentFull
    allowedTypes: [function, logicalComponent, physicalComponent, interface, designParameter, designDecision, systemRequirement, safetyRequirement, assumption]
    primaryType: function
    cascadeTypes: [function, logicalComponent, physicalComponent, designParameter, systemRequirement, safetyRequirement]
    approvalGate: {interface: [agreed, frozen], designDecision: [decided]}
    outline:
      - "1. Rôle du système et fonctions"
      - "2. Bases de conception (exigences, classement, hypothèses)"
      - "3. Description de l'architecture (fonctionnelle, logique, physique)"
      - "4. Description des matériels principaux"
      - "5. Fonctionnement normal, incidentel, accidentel"
      - "6. Contrôle-commande et IHM"
      - "7. Interfaces"
      - "8. Justification du respect des exigences (renvoi analyses)"
      - "9. Essais (de démarrage, périodiques)"
      - "10. Décisions de conception et écarts acceptés"

  - id: equipmentSpec
    fr: "Spécification technique d'équipement / d'approvisionnement (STE)"
    en: "Equipment / procurement specification"
    workflow: wfDocumentFull
    allowedTypes: [equipmentRequirement, safetyRequirement, regulatoryRequirement, interface, verificationCase, designParameter]
    primaryType: equipmentRequirement
    cascadeTypes: [equipmentRequirement, safetyRequirement, verificationCase, designParameter]
    approvalGate: {interface: [agreed, frozen]}
    outline:
      - "1. Objet, périmètre de fourniture, documents applicables"
      - "2. Classement (sûreté, mécanique / électrique, ESPN, qualification, sismique, ITNS)"
      - "3. Exigences fonctionnelles et de performance"
      - "4. Exigences de conception (code applicable, matériaux, chimie, durée de vie)"
      - "5. Exigences de fabrication et de contrôle (procédés spéciaux, CND, points d'arrêt)"
      - "6. Exigences de qualification (programme, normes, conditions)"
      - "7. Exigences qualité (ISO 19443 / NQA-1, CFSI, surveillance, documentation finale)"
      - "8. Livrables et dossier de fin de fabrication"
      - "Annexe : matrice de conformité à remplir par le fournisseur"

  - id: softwareRequirementsSpec
    fr: "Spécification d'exigences logicielles (SRS)"
    en: "Software requirements specification"
    workflow: wfDocumentFull
    allowedTypes: [softwareRequirement, hardwareRequirement, function, interface, assumption]
    primaryType: softwareRequirement
    cascadeTypes: [softwareRequirement, hardwareRequirement, function]
    approvalGate: {interface: [agreed, frozen]}
    outline:
      - "1. Objet, catégorie de la fonction supportée, norme applicable (IEC 60880 / 62138)"
      - "2. Contexte logiciel (plateforme, environnement d'ingénierie)"
      - "3. Exigences fonctionnelles"
      - "4. Exigences de performance et temps de réponse"
      - "5. Autosurveillance, comportement sur défaillance, robustesse"
      - "6. Exigences de cybersécurité"
      - "7. Interfaces et données"
      - "8. Exigences de vérification et de validation"

  - id: interfaceControlDocument
    fr: "Document de contrôle d'interfaces (ICD)"
    en: "Interface control document"
    workflow: wfDocumentFull
    allowedTypes: [interface, systemRequirement, equipmentRequirement, designParameter]
    primaryType: interface
    cascadeTypes: [systemRequirement, equipmentRequirement, designParameter]
    approvalGate: {interface: [agreed, frozen]}
    outline:
      - "1. Objet, entités et responsables des côtés A et B"
      - "2. Registre des interfaces (par type)"
      - "3. Données échangées (charges, débits, signaux, alimentations, encombrements)"
      - "4. Exigences d'interface"
      - "5. Statut de maturité et calendrier de gel"
      - "6. Points ouverts"

  - id: safetyCase
    fr: "Dossier / chapitre de démonstration de sûreté"
    en: "Safety case / safety report chapter"
    workflow: wfDocumentFull
    allowedTypes: [safetyRequirement, safetyClaim, hazard, analysis, assumption, regulatoryRequirement]
    primaryType: safetyRequirement
    cascadeTypes: [safetyRequirement, safetyClaim, hazard, analysis]
    outline:
      - "1. Objectifs et référentiel de sûreté applicable"
      - "2. Arborescence des revendications (claims) et stratégies"
      - "3. Événements initiateurs et agressions retenus (criblage)"
      - "4. Exigences de sûreté et dispositions de conception"
      - "5. Analyses support et conclusions"
      - "6. Hypothèses et limites du domaine de validité"
      - "7. Preuves (renvois vers V&V et livrables)"
      - "8. Engagements et points ouverts"

  - id: classificationList
    fr: "Note de classement / liste des EIP et exigences définies"
    en: "Classification note / EIP and defined requirements list"
    workflow: wfDocumentFull
    allowedTypes: [function, physicalComponent, safetyRequirement, systemRequirement]
    primaryType: function
    cascadeTypes: [function, physicalComponent, safetyRequirement, systemRequirement]
    outline:
      - "1. Méthode de classement et référentiel (schéma de classement du palier / projet)"
      - "2. Catégorisation des fonctions"
      - "3. Classement des SSC (sûreté, mécanique, électrique, qualification, sismique, ESPN)"
      - "4. Liste des EIP et exigences définies associées"
      - "5. Liste des AIP identifiées"

  - id: complianceMatrix
    fr: "Matrice de conformité (client / réglementaire)"
    en: "Compliance matrix"
    workflow: wfDocumentFull
    allowedTypes: [sourceRequirement, regulatoryRequirement]
    primaryType: sourceRequirement
    cascadeTypes: []
    approvalGate: {sourceRequirement: [accepted]}
    outline:
      - "1. Document source et révision traitée"
      - "2. Position de conformité exigence par exigence (statut, justification, renvoi)"
      - "3. Synthèse : non-conformités, dérogations demandées, clarifications"

  - id: vvPlan
    fr: "Plan de vérification et validation"
    en: "Verification & validation plan"
    workflow: wfDocumentFull
    allowedTypes: [verificationCase, review]
    primaryType: verificationCase
    cascadeTypes: [verificationCase]
    outline:
      - "1. Stratégie V&V (niveaux, étapes, méthodes, indépendance)"
      - "2. Organisation et responsabilités"
      - "3. Moyens (bancs, maquettes, simulateurs, qualification des outils)"
      - "4. Cas de vérification par niveau / étape"
      - "5. Points d'inspection et parties convoquées"
      - "6. Gestion des anomalies et non-régression"
      - "7. Critères de fin de V&V"

  - id: testProcedure
    fr: "Procédure d'essais"
    en: "Test procedure"
    workflow: wfDocumentFull
    allowedTypes: [verificationCase]
    primaryType: verificationCase
    cascadeTypes: [verificationCase]
    outline:
      - "1. Objet, exigences vérifiées, prérequis et configuration"
      - "2. Moyens, instrumentation (étalonnage), sécurité / RP"
      - "3. Séquence d'essai (étapes, résultats attendus, critères)"
      - "4. Points d'arrêt / de notification"
      - "5. Feuilles de relevés (via Test Run)"

  - id: toolingSpec
    fr: "Cahier des charges fonctionnel d'outillage"
    en: "Tooling functional specification"
    workflow: wfDocumentFull
    allowedTypes: [stakeholderRequirement, systemRequirement, function, operationalScenario, hazard, fmeaItem, assumption, interface]
    primaryType: stakeholderRequirement
    cascadeTypes: [stakeholderRequirement, systemRequirement, function, operationalScenario, hazard, fmeaItem]
    outline:
      - "1. Contexte et objectif de l'intervention"
      - "2. Expression fonctionnelle du besoin (fonctions de service et de contrainte, critères, niveaux, flexibilité – NF EN 16271)"
      - "3. Séquence d'intervention et scénarios (y compris modes dégradés, récupération)"
      - "4. Contraintes site (accès, encombrement, RP / débit de dose, contamination, FME, manutention, alimentations)"
      - "5. Exigences réglementaires machine (marquage CE ; règlement (UE) 2023/1230 applicable au 20/01/2027)"
      - "6. Analyse de risques machine et intervention"
      - "7. Exigences de qualification (maquette, essais de réception)"
      - "8. Livrables (dossier technique, notice, formation)"

  - id: fmeaWorksheet
    fr: "AMDEC / analyse de risques"
    en: "FMEA / risk analysis"
    workflow: wfDocumentFull
    allowedTypes: [fmeaItem, hazard, risk, action]
    primaryType: fmeaItem
    cascadeTypes: [fmeaItem, hazard]
    outline:
      - "1. Périmètre, méthode, échelles de cotation"
      - "2. Tableau AMDEC (éditeur tabulaire)"
      - "3. Actions et cotations résiduelles"

  - id: justificationNote
    fr: "Note de justification (fortuit / écart)"
    en: "Justification note (emergent issue / deviation)"
    workflow: wfDocumentLight
    allowedTypes: [technicalIssue, systemRequirement, equipmentRequirement, analysis, verificationCase, assumption, nonConformance]
    primaryType: technicalIssue
    cascadeTypes: [systemRequirement, equipmentRequirement, analysis, verificationCase]
    outline:
      - "1. Constat (description, localisation, données d'inspection)"
      - "2. Exigences et critères applicables (code, spécification, RSE-M...)"
      - "3. Hypothèses"
      - "4. Analyse / justification (renvoi notes de calcul)"
      - "5. Conclusion, conditions et limites (durée, surveillance)"
      - "6. Caractère générique et REX"

  - id: reloadSafetyReport
    fr: "Rapport de sûreté de recharge"
    en: "Reload safety evaluation report"
    workflow: wfDocumentFull
    allowedTypes: [designParameter, analysis, verificationCase, assumption, safetyRequirement]
    primaryType: designParameter
    cascadeTypes: [designParameter, analysis, verificationCase, safetyRequirement]
    outline:
      - "1. Données d'entrée du cycle (plan de chargement, historique)"
      - "2. Paramètres de sûreté de recharge vs limites des études de référence"
      - "3. Vérifications (neutronique, thermohydraulique, thermomécanique combustible)"
      - "4. Conclusion et conditions"
      - "5. Programme d'essais physiques de redémarrage"

  - id: modificationFile
    fr: "Dossier de modification (base installée)"
    en: "Plant modification file"
    workflow: wfDocumentFull
    allowedTypes: [changeRequest, systemRequirement, equipmentRequirement, safetyRequirement, physicalComponent, interface, analysis, verificationCase, regulatoryRequirement]
    primaryType: changeRequest
    cascadeTypes: [systemRequirement, equipmentRequirement, safetyRequirement, physicalComponent, analysis, verificationCase]
    outline:
      - "1. Objet de la modification, origine, applicabilité (palier, tranches)"
      - "2. Exigences de la modification"
      - "3. Description de la solution"
      - "4. Analyse d'impact (sûreté, RP, environnement, exploitation, documentation)"
      - "5. Éléments d'appréciation pour le classement réglementaire de la modification"
      - "6. Programme de requalification"
      - "7. Mise à jour des documents d'exploitation impactés"

  - id: managementPlan
    fr: "Plan de management (PQP, PMIS, PGC, PDL...)"
    en: "Management plan (QAP, SEMP, CMP, SDP...)"
    workflow: wfDocumentFull
    allowedTypes: [action, review, term]
    primaryType: action
    cascadeTypes: []
    outline:
      - "Plan libre selon gabarit du plan concerné"

  - id: regulatoryLibrary
    fr: "Extrait de texte réglementaire / normatif (bibliothèque)"
    en: "Regulatory / normative extract (library)"
    workflow: wfDocumentLibrary
    allowedTypes: [regulatoryRequirement, term]
    primaryType: regulatoryRequirement
    cascadeTypes: [regulatoryRequirement]
    outline:
      - "Structure miroir du texte source (titres, articles / clauses)"

  - id: genericProductSpec
    fr: "Spécification produit générique (ligne de produits)"
    en: "Generic product specification (product line)"
    workflow: wfDocumentLibrary
    allowedTypes: [stakeholderRequirement, systemRequirement, equipmentRequirement, safetyRequirement, function, physicalComponent, interface, designParameter, verificationCase]
    primaryType: stakeholderRequirement
    cascadeTypes: [stakeholderRequirement, systemRequirement, equipmentRequirement, safetyRequirement, function, physicalComponent, verificationCase]
    approvalGate: {interface: [agreed, frozen]}
    outline:
      - "Structure de la spécification maître ; conditions de variante par élément"

  - id: glossary
    fr: "Glossaire"
    en: "Glossary"
    workflow: wfDocumentLibrary
    allowedTypes: [term]
    primaryType: term
    cascadeTypes: [term]
    outline:
      - "Termes par ordre alphabétique"

  # --------------------------------------------------------------------------
  # Ajouts v0.3
  # --------------------------------------------------------------------------
  - id: qualificationDossier
    fr: "Dossier de qualification (procédé, matériel, code de calcul, équivalence CGD)"
    en: "Qualification dossier (process, equipment, calculation code, CGD equivalency)"
    workflow: wfDocumentFull
    allowedTypes: [verificationCase, equipmentRequirement, systemRequirement, softwareRequirement, designParameter, analysis, physicalComponent, assumption, deliverable]
    primaryType: verificationCase
    cascadeTypes: [verificationCase, equipmentRequirement, systemRequirement, softwareRequirement, designParameter, analysis, physicalComponent]
    outline:
      - "1. Objet, domaine de qualification / d'utilisation visé, référentiel (code, norme, guide ASN n°28 pour les codes, EPRI / 10 CFR 21 pour la CGD)"
      - "2. Exigences et caractéristiques critiques à démontrer"
      - "3. Paramètres et domaine (fenêtre de procédé, domaine de validation, conditions d'environnement)"
      - "4. Programme : essais, analyses, inspections, méthodes CGD retenues"
      - "5. Résultats (renvoi aux Test Runs signés et aux notes d'analyse)"
      - "6. Incertitudes, limites et conditions d'emploi"
      - "7. Conclusion et statut de qualification ; écarts et réserves"

  - id: workPackageHandover
    fr: "Procès-verbal de remise de lot (UO → projet)"
    en: "Work package handover record (unit → project)"
    workflow: wfDocumentLight
    allowedTypes: [workPackage, deliverable, verificationCase, nonConformance, action]
    primaryType: workPackage
    cascadeTypes: []
    approvalGate: {deliverable: [internallyApproved, issued, customerReviewed, final, superseded]}
    outline:
      - "1. Lot, UO réalisatrice, commande interne, révision du périmètre accordé"
      - "2. Livrables remis (état, indice, référence GED)"
      - "3. Preuves de vérification et écarts (FNC soldées ou transférées)"
      - "4. Réserves et actions de levée"
      - "5. Décision de réception"
