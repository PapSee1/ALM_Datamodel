# =============================================================================
#  Framatome SE / Polarion – Enumérations (source unique de vérité)
# -----------------------------------------------------------------------------
#  Convention :
#   - id      : identifiant technique Polarion (camelCase, ASCII, stable, jamais renommé)
#   - fr / en : libellés ; le générateur choisit la langue (--lang fr|en)
#   - desc    : définition opérationnelle (règle de saisie)
#   - default : option par défaut (au plus une par énumération)
#   - confidence : C (confirmé source publique) | P (probable) | H (hypothèse OSINT
#                  à valider en atelier interne – cf. docs/partie2)
#  Les énumérations marquées scope: project sont des gabarits : leurs valeurs
#  réelles sont surchargées au niveau projet (ex. tranches d'un contrat).
# =============================================================================

