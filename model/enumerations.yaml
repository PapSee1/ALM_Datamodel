# =============================================================================
#  Framatome SE / Polarion – Enumérations (source unique de vérité)
# -----------------------------------------------------------------------------
#  Convention :
#   - id      : identifiant technique Polarion (camelCase, ASCII, stable, jamais renommé)
#   - fr / en : libellés ; le générateur choisit la langue (--lang fr|en)
#   - desc    : définition opérationnelle (règle de saisie)
#   - default : option par défaut (au plus une par énumération)
#   - confidence : C (confirmé source publique) | P (probable) | H (hypothèse OSINT
#                  à valider en atelier interne – cf. docs/partie2)
#  Les énumérations marquées scope: project sont des gabarits : leurs valeurs
#  réelles sont surchargées au niveau projet (ex. tranches d'un contrat).
# =============================================================================

enumerations:

  # ---------------------------------------------------------------------------
  # 1. Organisation & contexte projet
  # ---------------------------------------------------------------------------
  businessUnit:
    fr: "Business Unit"
    en: "Business Unit"
    confidence: C
    desc: >
      BU propriétaire de l'artefact / du projet, selon l'organisation publiée (page
      Governance de framatome.com et résultats financiers 2025, consultés en octobre 2026 ;
      annexe C § 1). Les BU opérationnelles sont IB, Fuel, I&C et PCM ; la Direction
      technique et ingénierie (DTI) est portée au Comex par la direction « Engineering &
      Design Authority » et comptée publiquement comme une cinquième BU. Healthcare,
      Defense et Space sont des marques / divisions. À re-valider à chaque réorganisation.
    options:
      - {id: ib,     fr: "Base installée (Installed Base, IB)",            en: "Installed Base (IB)", desc: "[C] « Installed Base Business Unit » ; ≈ 4 000 à 4 600 personnes, 15 pays (offres d'emploi 2026)."}
      - {id: fuel,   fr: "Combustible (BU Fuel)",                           en: "Fuel", desc: "[C] « Fuel Business Unit » ; l'« excellence opérationnelle » figure dans le titre du dirigeant, pas dans le nom de la BU."}
      - {id: ics,    fr: "Contrôle-commande (I&C, dont BL Cybersécurité)",  en: "Instrumentation & Control (incl. Cybersecurity BL)", desc: "[C] « Instrumentation and Control Business Unit » ; BL Cybersécurité (Allentis, Cyberwatch, FoxGuard) depuis les résultats 2025."}
      - {id: pcm,    fr: "Projets & fabrication de composants (PCM)",       en: "Projects & Components Manufacturing (PCM)", desc: "[C] « Projects and Components Manufacturing » (fusion Large Projects + Component Manufacturing, 2020) ; BL Robinetterie depuis 2024-2026."}
      - {id: dti,    fr: "Direction technique & ingénierie (DTI / E&DA)",   en: "Technical & Engineering Directorate (DTI / E&DA)", desc: "[P] direction « Engineering & Design Authority » au Comex ; la DTI assure conception, licensing des chaudières et centres techniques."}
      - {id: corp,   fr: "Fonctions transverses (Sûreté, Qualité, DSI...)", en: "Corporate functions (Safety, Quality, IT...)", desc: "Choix de modélisation : porte les bibliothèques LIB-* et les fonctions support."}
      - {id: healthcare, fr: "Framatome Healthcare (hors vague 1)",         en: "Framatome Healthcare (out of wave 1)", desc: "[C] marque lancée le 08/07/2021 (isotopes médicaux)."}
      - {id: defense, fr: "Framatome Defense (instance dédiée si requis)",  en: "Framatome Defense (dedicated instance if required)", desc: "[C] marque / division lancée le 19/10/2020 ; ligne propulsion militaire à Jeumont (2025)."}
      - {id: space,  fr: "Framatome Space (hors vague 1)",                  en: "Framatome Space (out of wave 1)", desc: "[C] marque lancée le 19/10/2023."}


  businessLine:
    fr: "Business Line"
    en: "Business Line"
    confidence: P
    scope: project
    desc: >
      Niveau immédiatement inférieur à la BU (les unités opérationnelles, sites et
      départements sont dans operationalUnit). Aucune liste officielle n'est publique :
      les codes entre parenthèses (IBE, IBM-F, IBC, IBS-F, IBT, FCEE, DOC, DTIM...)
      proviennent d'offres d'emploi Framatome 2022-2026 (annexe C § 1, sources S-29 à
      S-95) ; [C] ≥ 2 sources concordantes, [P] une seule source, [H] hypothèse. Liste à
      confirmer en atelier (Q-ORG-01) et surchargée dans chaque projet.
    options:
      - {id: ibEngineering,       fr: "BI – Ingénierie (IBE, Engineering Services)",                     en: "IB – Engineering services (IBE)", desc: "[C] ≈ 1 500 personnes France + Allemagne ; parc, export, nouveau nucléaire, démantèlement, réacteurs avancés."}
      - {id: ibMajorProjects,     fr: "BI – Grands projets, remplacement de composants (IBM-F)",          en: "IB – Major projects, component replacement (IBM-F)", desc: "[C] « Business Line Grands Projets (IBM-F) » : RGV, tronçons du circuit primaire (Chalon)."}
      - {id: ibConstruction,      fr: "BI – Construction nouveau nucléaire (IBC)",                        en: "IB – New-build construction (IBC)", desc: "[C] montage tuyauteries et équipements, EPR, EPR2, EPR1200, SMR ; chantiers HPC, Penly."}
      - {id: ibMaintenance,       fr: "BI – Maintenance / support technique (IBS-F, CEDEM)",              en: "IB – Maintenance / technical support (IBS-F, CEDEM)", desc: "[C] ≈ 350 personnes ; bureau d'études outillages (IBSE-F), CEDEM (IBSED-F)."}
      - {id: ibSiteWorks,         fr: "BI – Direction Travaux (IBT)",                                     en: "IB – Site works directorate (IBT)", desc: "[C] préparation et réalisation des opérations de maintenance, équipes mobiles (Chalon)."}
      - {id: ibInspection,        fr: "BI – Inspection / CND (Intercontrôle)",                            en: "IB – Inspection / NDE (Intercontrôle)", desc: "[C] filiale à 100 %, rattachée à la BU IB."}
      - {id: ibInternational,     fr: "BI – Entités internationales (Framatome Inc., GmbH, Canada, UK, Reaktortest)", en: "IB – International entities", desc: "[P] Business Lines US (Steam Generator Services, Outage Services, Nuclear Parts Center, Component Replacement & Repair...), Canada (CANDU), UK, Allemagne."}
      - {id: fuelContracts,       fr: "Comb. – Contrats et services combustible (FCEE, Contracts & Services)", en: "Fuel – Fuel contracts & services (FCEE)", desc: "[C] FCEE (Fuel Contracts Europe Export, Erlangen) ; [P] Contracts & Services (Lynchburg)."}
      - {id: fuelDesign,          fr: "Comb. – Conception combustible et méthodes",                       en: "Fuel – Fuel design & methods", desc: "[P] « Fuel Design » attesté aux États-Unis ; organisation France non publiée."}
      - {id: fuelCore,            fr: "Comb. – Physique du cœur / recharges",                             en: "Fuel – Core physics / reloads", desc: "[P] « département Physique du Cœur » (Lyon)."}
      - {id: fuelManufacturing,   fr: "Comb. – Fabrication d'assemblages (Romans, Lingen, Richland)",     en: "Fuel – Fuel assembly manufacturing", desc: "[C] « Fuel Manufacturing Business Line » (Richland) ; Romans ; ANF Lingen / Karlstein."}
      - {id: fuelComponentsOperations, fr: "Comb. – Direction des Opérations Composants (DOC, filière zirconium)", en: "Fuel – Components Operations Directorate (DOC, zirconium)", desc: "[C] Jarrie, Ugine, Rugles, Montreuil-Juigné, Paimboeuf ; Montbard cité par une offre (conflit avec PCM, Q-ORG-05)."}
      - {id: fuelCerca,           fr: "Comb. – CERCA (réacteurs de recherche, cibles médicales)",          en: "Fuel – CERCA (research reactors, medical targets)", desc: "[C] nouvel atelier Romans 2025 ; ligne pilote TRISO annoncée."}
      - {id: fuelFieldServices,   fr: "Comb. – Services combustible sur site",                            en: "Fuel – Fuel field services", desc: "[P] « Fuel Field Services » (Erlangen)."}
      - {id: icSafetySystems,     fr: "C-C – Systèmes de sûreté et plateformes qualifiées",                en: "I&C – Safety systems & qualified platforms", desc: "[H] activité confirmée (TXS, Spinline...), découpage interne non publié."}
      - {id: icInstrumentation,   fr: "C-C – Instrumentation nucléaire et produits",                      en: "I&C – Nuclear instrumentation & products", desc: "[P] « ICTNMU Business Line » (Lynchburg), fabrication de produits d'instrumentation (Montbonnot), Karlstein."}
      - {id: icProjects,          fr: "C-C – Projets et services",                                        en: "I&C – Projects & services", desc: "[P] « ICE-U Projects Engineer Business Line », projets Leittechnik (Erlangen)."}
      - {id: icCyber,             fr: "C-C – Cybersécurité",                                              en: "I&C – Cybersecurity", desc: "[C] BL Cybersécurité : Allentis, Cyberwatch, FoxGuard."}
      - {id: pcmLargeProjects,    fr: "PCM – Grands projets et programmes (EPR2, HPC, SZC, NUWARD)",      en: "PCM – Large projects & programmes", desc: "[P] « PCM business unit, which houses the large projects and programmes » ; planificateur NUWARD rattaché à PCM."}
