# =============================================================================
#  Framatome SE / Polarion – Scénarios de couverture par typologie de projet
# -----------------------------------------------------------------------------
#  Chaque scénario décrit ce dont une typologie de projet a BESOIN dans le
#  modèle (types, documents, chaînes de traçabilité, attributs, valeurs
#  d'énumération). Le validateur (tools/almmodel.py) vérifie pour chacun :
#   1. types et documents présents dans le PROFIL EFFECTIF de la typologie
#      (classe de tailoring ∪ compléments addTypes / addDocuments) ;
#   2. chaque trace [source, rôle, cible] autorisée par les règles de liens
#      (une trace 'xp' peut viser un autre projet : bibliothèque, ligne de
#      produits, projet de référence du parc) ;
#   3. attributs présents sur les types ; valeurs d'énumération existantes.
#  L'annexe générée A9 restitue la matrice de couverture.
#  Format d'une trace : [source, rôle, cible] ou [source, rôle, cible, xp]
# =============================================================================

