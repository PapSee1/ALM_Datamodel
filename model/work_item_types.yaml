      engagement pris dans un dossier, suivi jusqu'à la clôture.
    fieldSets: [common]
    fields:
      - {id: authority,         type: "enum:authority", fr: "Autorité / émetteur", en: "Authority / issuer", required: true}
      - {id: commitmentSource,  type: "enum:commitmentSource", fr: "Origine", en: "Origin", required: true}
      - {id: requestCategory,   type: "enum:requestCategory", fr: "Nature", en: "Category"}
      - {id: authorityReference, type: string, fr: "Référence du courrier / décision", en: "Letter / decision reference", required: true}
      - {id: requestText,       type: richtext, fr: "Texte de la demande", en: "Request text"}
      - {id: commitmentText,    type: richtext, fr: "Réponse / engagement", en: "Response / commitment"}
      - {id: commitmentDueDate, type: date, fr: "Échéance", en: "Due date", required: true}
      - {id: responseReference, type: string, fr: "Référence de la réponse", en: "Response reference"}
      - {id: licensee,          type: string, fr: "Exploitant concerné", en: "Licensee"}
      - {id: regulatoryFramework, type: "enum:regulatoryFramework", fr: "Cadre réglementaire (pack)", en: "Regulatory framework (pack)"}

