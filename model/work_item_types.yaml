    fr: "Agression / événement initiateur"
    en: "Hazard / initiating event"
    color: "#B71C1C"
    workflow: wfSafetyAnalysisItem
    desc: "Événement initiateur postulé, agression interne/externe, danger machine ou radiologique."
    fieldSets: [common]
    fields:
      - {id: hazardType,       type: "enum:hazardType", fr: "Type", en: "Type", requiredAt: "soumission"}
      - {id: plantConditions,  type: "enum:plantCondition", multi: true, fr: "Condition de fonctionnement", en: "Plant condition"}
      - {id: plantStates,      type: "enum:plantState", multi: true, fr: "États d'exploitation concernés", en: "Plant states"}
      - {id: frequencyBand,    type: "enum:initiatingEventFrequency", fr: "Bande de fréquence", en: "Frequency band"}
      - {id: screening,        type: "enum:hazardScreening", fr: "Criblage", en: "Screening"}
      - {id: consequences,     type: richtext, fr: "Conséquences", en: "Consequences"}
      - {id: decouplingCriteria, type: richtext, fr: "Critères de découplage / radiologiques", en: "Decoupling / radiological criteria"}

  - id: safetyClaim
    family: safety
    fr: "Revendication de sûreté (argumentaire)"
    en: "Safety claim (argument)"
    color: "#880E4F"
    workflow: wfSafetyAnalysisItem
    desc: >
      Élément d'argumentaire Claims-Arguments-Evidence / GSN structurant la
      démonstration de sûreté (attendu notamment au Royaume-Uni, utile partout).
    fieldSets: [common]
    fields:
      - {id: gsnElementType, type: "enum:gsnElementType", fr: "Élément", en: "Element", required: true}
      - {id: claimLevel,     type: integer, fr: "Niveau dans l'arborescence", en: "Tree level"}
      - {id: confidence,     type: "enum:confidenceLevel", fr: "Confiance", en: "Confidence"}
      - {id: context,        type: richtext, fr: "Contexte / hypothèses", en: "Context / assumptions"}
      - {id: evidenceCoverage, type: float, computed: true, fr: "Couverture par preuves (%)", en: "Evidence coverage (%)"}

  - id: risk
    family: safety
    fr: "Risque / opportunité"
    en: "Risk / opportunity"
    color: "#E65100"
    workflow: wfRisk
    creationMode: manual
    desc: "Risque projet ou technique (ISO 31000) ; les risques de sûreté de l'installation relèvent de 'hazard'."
