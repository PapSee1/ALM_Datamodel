      sismique, études de cœur, FOH, dosimétrie...). Produit d'une AIP en
      général : contrôle technique indépendant obligatoire.
    fieldSets: [common, documentReference]
    fields:
      - {id: analysisType,     type: "enum:analysisType", fr: "Type", en: "Type", requiredAt: "soumission"}
      - {id: calculationCode,  type: string, fr: "Code / outil de calcul", en: "Calculation code / tool"}
      - {id: codeVersion,      type: string, fr: "Version du code", en: "Code version"}
      - {id: codeQualification, type: "enum:codeQualification", fr: "Statut du code", en: "Code status"}
      - {id: codeQualificationRationale, type: richtext, fr: "Justification de l'emploi d'un code non qualifié", en: "Rationale for using a non-qualified code", desc: "Obligatoire pour approuver une analyse dont le code n'est pas qualifié (condition de wfAnalysis.approve)."}
      - {id: inputDataSummary, type: richtext, fr: "Données d'entrée", en: "Input data"}
      - {id: conclusion,       type: richtext, fr: "Conclusion", en: "Conclusion"}
      - {id: analysisResult,   type: "enum:analysisResult", fr: "Résultat", en: "Result"}
