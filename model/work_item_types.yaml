    fields:
      - {id: riskCategory,   type: "enum:riskCategory", fr: "Catégorie", en: "Category", required: true}
      - {id: isOpportunity,  type: boolean, fr: "Opportunité", en: "Opportunity"}
      - {id: probability,    type: integer, fr: "Probabilité (1-5)", en: "Probability (1-5)", required: true}
      - {id: impact,         type: integer, fr: "Impact (1-5)", en: "Impact (1-5)", required: true}
      - {id: criticality,    type: integer, computed: true, fr: "Criticité (P×I)", en: "Criticality (P×I)"}
      - {id: riskLevel,      type: "enum:riskLevel", computed: true, fr: "Niveau", en: "Level"}
      - {id: riskStrategy,   type: "enum:riskStrategy", fr: "Stratégie", en: "Strategy"}
      - {id: residualProbability, type: integer, fr: "Probabilité résiduelle", en: "Residual probability"}
      - {id: residualImpact, type: integer, fr: "Impact résiduel", en: "Residual impact"}
      - {id: exposureCost,   type: currency, fr: "Exposition financière", en: "Cost exposure"}
      - {id: triggerDate,    type: date, fr: "Date de déclenchement", en: "Trigger date"}
      - {id: riskOwner,      type: user, fr: "Propriétaire", en: "Owner"}

  - id: fmeaItem
    family: safety
    fr: "Ligne d'AMDEC (mode de défaillance)"
    en: "FMEA line (failure mode)"
    color: "#D84315"
    workflow: wfSafetyAnalysisItem
    desc: "Mode de défaillance analysé (édition tabulaire recommandée via extension type Risksheet)."
    fieldSets: [common]
    fields:
      - {id: fmeaType,         type: "enum:fmeaType", fr: "Type d'AMDEC", en: "FMEA type", requiredAt: "soumission"}
      - {id: analysedFunction, type: richtext, fr: "Fonction / étape analysée", en: "Analysed function / step"}
