      - {id: ccbDate,          type: date, fr: "Date CCB", en: "CCB date"}
      - {id: ccbReference,     type: string, fr: "Référence du relevé de décision", en: "CCB minutes reference"}
      - {id: customerApprovalRequired, type: "enum:yesNoTbd", fr: "Accord client requis", en: "Customer approval required"}
