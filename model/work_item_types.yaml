# =============================================================================
#  Framatome SE / Polarion – Types de Work Items et attributs (Custom Fields)
# -----------------------------------------------------------------------------
#  Principes de modélisation (cf. docs/partie3/08_Modele_de_donnees.md) :
#   P1. Un type = un cycle de vie distinct OU une règle de traçabilité distincte.
#       Sinon, on discrimine par attribut (ex. reqLevel, analysisType).
#   P2. Les champs natifs Polarion (title, description, status, resolution,
#       severity, priority, assignee, author, dueDate, plannedIn, categories,
#       hyperlinks, attachments, approvals, comments) ne sont JAMAIS dupliqués.
#   P3. Les attributs réutilisables sont regroupés en "fieldSets" (mixins)
#       et expansés par le générateur (tools/generate_polarion_config.py).
#   P4. Tout attribut de classement de sûreté accepte "À déterminer" : on ne
#       force jamais une valeur par défaut affirmative sur un sujet de sûreté.
#   P5. Les champs "computed: true" sont alimentés par script/job (jamais saisis).
#
#  Types de champ (vocabulaire neutre → mappage Polarion dans le générateur) :
#   string | text | richtext | integer | float | currency | date | datetime |
#   duration | boolean | enum:<enumId> | user | testSteps
# =============================================================================

fieldSets:

  common:
    desc: "Attributs transverses à tous les artefacts d'ingénierie."
    fields:
      - {id: discipline,           type: "enum:discipline", fr: "Discipline pilote", en: "Lead discipline", required: true}
      - {id: contributingDisciplines, type: "enum:discipline", multi: true, fr: "Disciplines contributrices", en: "Contributing disciplines"}
      - {id: externalId,           type: string, fr: "Identifiant externe", en: "External ID", desc: "ID dans le document source, chez le client (ReqIF) ou dans l'outil hérité (migration)."}
      - {id: sourceReference,      type: string, fr: "Référence source", en: "Source reference", desc: "Document / révision / paragraphe d'origine."}
      - {id: applicablePlantSeries, type: "enum:plantSeries", multi: true, fr: "Paliers applicables", en: "Applicable plant series"}
      - {id: applicableUnits,      type: "enum:plantUnit", multi: true, fr: "Tranches applicables", en: "Applicable units", desc: "Énumération surchargée au niveau projet."}
      - {id: applicabilityCondition, type: text, fr: "Condition d'applicabilité", en: "Applicability condition", desc: "Règle de variante en clair (ou expression du modèle de variabilité)."}
      - {id: lifecyclePhase,       type: "enum:lifecyclePhase", fr: "Phase", en: "Phase"}
      - {id: informationClassification, type: "enum:informationClassification", fr: "Classification de l'information", en: "Information classification", required: true}
      - {id: exportControl,        type: "enum:exportControl", fr: "Contrôle export", en: "Export control", required: true}
      - {id: wbsCode,              type: string, fr: "Code WBS / OTP", en: "WBS code"}
      - {id: transitionNote,       type: text, fr: "Motif de la dernière transition", en: "Last transition note", desc: "Exigé par les transitions de retour, rejet, réouverture, annulation (l'historique conserve toutes les valeurs)."}

  requirementCore:
    desc: "Attributs de toute exigence rédigée (hors exigences d'entrée verbatim)."
    fields:
      - {id: reqCategory,        type: "enum:reqCategory", fr: "Catégorie", en: "Category", required: true}
      - {id: bindingLevel,       type: "enum:bindingLevel", fr: "Force", en: "Binding level"}
      - {id: rationale,          type: richtext, fr: "Justification (rationale)", en: "Rationale"}
      - {id: acceptanceCriteria, type: richtext, fr: "Critères d'acceptation", en: "Acceptance criteria"}
      - {id: verificationMethods, type: "enum:verificationMethod", multi: true, fr: "Méthodes de vérification", en: "Verification methods", requiredAt: approved}
      - {id: vvStagesPlanned,    type: "enum:vvStage", multi: true, fr: "Étapes V&V prévues", en: "Planned V&V stages"}
      - {id: maturity,           type: "enum:maturity", fr: "Maturité", en: "Maturity"}
      - {id: plantStates,        type: "enum:plantState", multi: true, fr: "États d'exploitation", en: "Plant states"}
      - {id: plantConditions,    type: "enum:plantCondition", multi: true, fr: "Conditions de fonctionnement", en: "Plant conditions"}
      - {id: verificationStatus, type: "enum:vvStatus", computed: true, fr: "Statut de vérification (calculé)", en: "Verification status (computed)"}
      - {id: customerApprovalRequired, type: "enum:yesNoTbd", fr: "Accord client requis pour modification", en: "Customer approval required for change"}

  requirementSafety:
    desc: "Pertinence sûreté d'une exigence (le classement détaillé est porté par la fonction / le SSC)."
    fields:
      - {id: safetyRelevant,     type: "enum:yesNoTbd", fr: "Pertinente pour la sûreté", en: "Safety relevant", required: true}
      - {id: definedRequirement, type: "enum:yesNoTbd", fr: "Exigence définie (EIP)", en: "Defined requirement (EIP)", required: true, desc: "Exigence assignée à un EIP au sens de l'arrêté INB : déclenche le socle non négociable (contrôle technique, traçabilité V&V, gestion d'écart)."}
      - {id: protectedInterests, type: "enum:protectedInterest", multi: true, fr: "Intérêts protégés", en: "Protected interests"}
      - {id: safetyClassScheme,  type: "enum:safetyClassScheme", fr: "Référentiel de classement", en: "Classification scheme"}
      - {id: safetyClass,        type: "enum:safetyClass", fr: "Classe de sûreté héritée", en: "Inherited safety class", desc: "Classe la plus sévère des éléments auxquels l'exigence est allouée (contrôlée par rapport)."}
      - {id: functionCategory,   type: "enum:functionCategory", fr: "Catégorie de fonction héritée", en: "Inherited function category"}
      - {id: securityRelevant,   type: "enum:yesNoTbd", fr: "Pertinente cybersécurité", en: "Security relevant"}

  sscClassification:
    desc: "Classement complet d'une structure, d'un système ou d'un composant (SSC) – note de classement."
    fields:
      - {id: safetyClassScheme,  type: "enum:safetyClassScheme", fr: "Référentiel de classement", en: "Classification scheme", required: true}
      - {id: safetyClass,        type: "enum:safetyClass", fr: "Classe de sûreté", en: "Safety class"}
      - {id: eip,                type: "enum:yesNoTbd", fr: "EIP (élément important pour la protection)", en: "EIP (important for protection)", required: true}
      - {id: protectedInterests, type: "enum:protectedInterest", multi: true, fr: "Intérêts protégés", en: "Protected interests"}
      - {id: ipsLegacy,          type: "enum:yesNoTbd", fr: "IPS (terminologie parc historique)", en: "IPS (legacy fleet term)"}
      - {id: itns,               type: "enum:yesNoTbd", fr: "ITNS (ISO 19443)", en: "ITNS (ISO 19443)"}
      - {id: qaProgramLevel,     type: "enum:qaProgramLevel", fr: "Programme qualité", en: "QA programme"}
      - {id: mechanicalClass,    type: "enum:mechanicalClass", fr: "Classe mécanique", en: "Mechanical class"}
      - {id: electricalClass,    type: "enum:electricalClass", fr: "Classe électrique", en: "Electrical class"}
      - {id: qualificationClass, type: "enum:qualificationClass", fr: "Classe de qualification", en: "Qualification class"}
      - {id: seismicCategory,    type: "enum:seismicCategory", fr: "Catégorie sismique", en: "Seismic category"}
      - {id: seismicCriterion,   type: "enum:seismicCriterion", fr: "Exigence sismique", en: "Seismic requirement"}
      - {id: espnLevel,          type: "enum:espnLevel", fr: "Niveau ESPN", en: "ESPN level"}
      - {id: espnCategory,       type: "enum:espnCategory", fr: "Catégorie ESP", en: "PE category"}
      - {id: icSystemClass,      type: "enum:icSystemClass", fr: "Classe système C-C", en: "I&C system class"}
      - {id: securityDegree,     type: "enum:securityDegree", fr: "Degré de sécurité cyber", en: "Security degree"}
      - {id: classificationRationale, type: richtext, fr: "Justification du classement", en: "Classification rationale"}
      - {id: classificationValidated, type: boolean, fr: "Classement validé par la Sûreté", en: "Classification validated by Safety"}

  functionSafety:
    desc: "Catégorisation d'une fonction."
    fields:
      - {id: safetyClassScheme,  type: "enum:safetyClassScheme", fr: "Référentiel de classement", en: "Classification scheme"}
      - {id: functionCategory,   type: "enum:functionCategory", fr: "Catégorie de fonction", en: "Function category", required: true}
      - {id: fundamentalSafetyFunction, type: "enum:fundamentalSafetyFunction", fr: "Fonction fondamentale de sûreté", en: "Fundamental safety function"}
      - {id: defenceInDepthLevel, type: "enum:defenceInDepthLevel", multi: true, fr: "Niveaux de défense en profondeur", en: "DiD levels"}
      - {id: protectedInterests, type: "enum:protectedInterest", multi: true, fr: "Intérêts protégés", en: "Protected interests"}
      - {id: plantStates,        type: "enum:plantState", multi: true, fr: "États d'exploitation", en: "Plant states"}
      - {id: plantConditions,    type: "enum:plantCondition", multi: true, fr: "Conditions de fonctionnement", en: "Plant conditions"}
      - {id: securityDegree,     type: "enum:securityDegree", fr: "Degré de sécurité cyber", en: "Security degree"}
      - {id: categorisationRationale, type: richtext, fr: "Justification de la catégorisation", en: "Categorisation rationale"}

  documentReference:
    desc: "Référencement documentaire (GED = système d'archivage de référence)."
    fields:
      - {id: documentNumber,   type: string, fr: "N° de document", en: "Document number"}
      - {id: revisionIndex,    type: string, fr: "Indice", en: "Revision index"}
      - {id: customerDocumentNumber, type: string, fr: "N° document client", en: "Customer document number"}
      - {id: aip,              type: "enum:yesNoTbd", fr: "Produit d'une AIP", en: "Output of an AIP", desc: "Activité importante pour la protection → contrôle technique indépendant obligatoire."}

# =============================================================================
#  TYPES
#  family : requirements | architecture | safety | vv | change | project | library
#  color  : couleur d'affichage Polarion
# =============================================================================
workItemTypes:

  # --------------------------------------------------------------------------
  # Famille EXIGENCES
  # --------------------------------------------------------------------------
  - id: sourceRequirement
    family: requirements
    fr: "Exigence d'entrée"
    en: "Input requirement"
    color: "#7E57C2"
    workflow: wfInputRequirement
    desc: >
      Exigence reçue verbatim (contrat, CCTP, spécification client, EUR, donnée
      d'entrée) et importée (ReqIF / Word / Excel). Le texte original n'est
      jamais modifié : on y porte la position de conformité.
    fieldSets: [common]
    fields:
      - {id: requirementSourceType, type: "enum:requirementSourceType", fr: "Nature de la source", en: "Source type", required: true}
      - {id: sourceDocument,     type: string, fr: "Document source", en: "Source document", required: true}
      - {id: sourceDocumentRevision, type: string, fr: "Révision du document source", en: "Source document revision"}
      - {id: sourceParagraph,    type: string, fr: "Paragraphe", en: "Paragraph"}
      - {id: originalText,       type: richtext, fr: "Texte original (verbatim)", en: "Original text (verbatim)", readOnlyAfter: accepted}
      - {id: sourceIssuer,       type: "enum:stakeholder", fr: "Émetteur", en: "Issuer"}
      - {id: complianceStatus,   type: "enum:complianceStatus", fr: "Statut de conformité", en: "Compliance status", required: true}
      - {id: complianceStatement, type: richtext, fr: "Position de conformité", en: "Compliance statement"}
      - {id: safetyRelevant,     type: "enum:yesNoTbd", fr: "Pertinente pour la sûreté", en: "Safety relevant"}
      - {id: verificationStatus, type: "enum:vvStatus", computed: true, fr: "Statut de vérification (calculé)", en: "Verification status (computed)"}

  - id: regulatoryRequirement
    family: requirements
    fr: "Exigence réglementaire / normative"
    en: "Regulatory / normative requirement"
    color: "#5E35B1"
    workflow: wfLibraryItem
    desc: >
      Exigence extraite d'un texte réglementaire, d'un guide ou d'une norme.
      Maintenue dans le projet bibliothèque LIB-REG et réutilisée (branche de
      document) dans les projets. Pour les textes sous droit d'auteur (AFCEN,
      IEC, ISO), on stocke la référence et une paraphrase, jamais le texte
      intégral sans licence.
    fieldSets: [common]
    fields:
      - {id: regulatoryDocType,  type: "enum:regulatoryDocType", fr: "Type de texte", en: "Document type", required: true}
      - {id: regulatoryReference, type: string, fr: "Référence (texte, article / clause)", en: "Reference (text, article / clause)", required: true}
      - {id: edition,            type: string, fr: "Édition / version", en: "Edition / version", required: true}
      - {id: jurisdiction,       type: "enum:region", fr: "Juridiction", en: "Jurisdiction"}
      - {id: bindingLevel,       type: "enum:bindingLevel", fr: "Force", en: "Binding level"}
      - {id: effectiveDate,      type: date, fr: "Date d'application", en: "Effective date"}
      - {id: transitionalProvisions, type: richtext, fr: "Dispositions transitoires", en: "Transitional provisions"}
      - {id: copyrightRestricted, type: boolean, fr: "Texte protégé (paraphrase)", en: "Copyrighted text (paraphrased)"}
      - {id: complianceStatus,   type: "enum:complianceStatus", fr: "Statut de conformité (copie projet)", en: "Compliance status (project copy)"}
      - {id: complianceStatement, type: richtext, fr: "Position de conformité (copie projet)", en: "Compliance statement (project copy)"}
      - {id: verificationStatus, type: "enum:vvStatus", computed: true, fr: "Statut de vérification (calculé)", en: "Verification status (computed)"}

  - id: stakeholderRequirement
    family: requirements
    fr: "Exigence de besoin (parties prenantes)"
    en: "Stakeholder requirement"
    color: "#1E88E5"
    workflow: wfRequirement
    desc: >
      Besoin reformulé, univoque et vérifiable (INCOSE GtWR), niveau STB.
      Dérivé des exigences d'entrée et réglementaires ; validé par scénarios.
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: stakeholder,  type: "enum:stakeholder", multi: true, fr: "Parties prenantes", en: "Stakeholders", required: true}
      - {id: needStatement, type: richtext, fr: "Énoncé du besoin", en: "Need statement"}

  - id: systemRequirement
    family: requirements
    fr: "Exigence système"
    en: "System requirement"
    color: "#1565C0"
    workflow: wfRequirement
    desc: >
      Exigence de solution aux niveaux installation / système / sous-système
      (ST, STS, SDM). Le niveau est porté par reqLevel.
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: reqLevel, type: "enum:reqLevel", fr: "Niveau", en: "Level", required: true}

  - id: equipmentRequirement
    family: requirements
    fr: "Exigence équipement"
    en: "Equipment requirement"
    color: "#0D47A1"
    workflow: wfRequirement
    desc: >
      Exigence au niveau équipement / composant ; base des spécifications
      d'approvisionnement (STE) et des cahiers des charges fournisseurs.
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: reqLevel,          type: "enum:reqLevel", fr: "Niveau", en: "Level", required: true}
      - {id: procurementSpec,   type: string, fr: "Spécification d'approvisionnement", en: "Procurement specification"}
      - {id: designCode,        type: string, fr: "Code / norme de conception applicable", en: "Applicable design code"}
      - {id: espnRelevant,      type: "enum:yesNoTbd", fr: "Concerne un ESPN", en: "Relates to ESPN"}

  - id: softwareRequirement
    family: requirements
    fr: "Exigence logicielle"
    en: "Software requirement"
    color: "#00838F"
    workflow: wfRequirement
    desc: >
      Exigence logicielle (C-C IEC 60880 / IEC 62138, logiciels d'outillage).
      La catégorie de la fonction supportée détermine l'exigence de V&V.
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: swRequirementKind, type: "enum:reqCategory", fr: "Nature", en: "Kind"}
      - {id: softwareItem,      type: string, fr: "Article logiciel cible", en: "Target software item"}
      - {id: selfMonitoring,    type: boolean, fr: "Exigence d'autosurveillance", en: "Self-monitoring requirement"}

  - id: hardwareRequirement
    family: requirements
    fr: "Exigence matérielle / HDL"
    en: "Hardware / HDL requirement"
    color: "#006064"
    workflow: wfRequirement
    desc: "Exigence de matériel électronique, de module ou de composant HDL/FPGA (IEC 60987, IEC 62566)."
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: hwTechnology, type: string, fr: "Technologie", en: "Technology", desc: "Électronique conventionnelle, microprocesseur, HDL/FPGA, électromécanique."}

  - id: safetyRequirement
    family: requirements
    fr: "Exigence de sûreté"
    en: "Safety requirement"
    color: "#C62828"
    workflow: wfRequirement
    desc: >
      Exigence issue de la démonstration de sûreté (études d'accidents, EPS,
      agressions, règles de classement, défense en profondeur). Portée par
      la discipline Sûreté ; allouée aux fonctions et SSC.
    fieldSets: [common, requirementCore, requirementSafety]
    fields:
      - {id: safetyRequirementSource, type: "enum:safetyRequirementSource", fr: "Origine", en: "Origin", required: true}
      - {id: defenceInDepthLevel, type: "enum:defenceInDepthLevel", multi: true, fr: "Niveaux de défense en profondeur", en: "DiD levels"}
      - {id: singleFailureApplicable, type: "enum:yesNoTbd", fr: "Critère de défaillance unique applicable", en: "Single failure criterion applicable"}
      - {id: analysisReference, type: string, fr: "Référence de l'étude support", en: "Supporting analysis reference"}

  - id: assumption
    family: requirements
    fr: "Hypothèse / donnée d'entrée"
    en: "Assumption / design input"
    color: "#F9A825"
    workflow: wfAssumption
    desc: >
      Hypothèse de conception ou donnée d'entrée (site, client, fournisseur,
      hypothèse d'étude) qui doit être confirmée. Toute modification rend
      suspects les artefacts qui s'appuient dessus (lien 'assumes').
    fieldSets: [common]
    fields:
      - {id: assumptionType, type: string, fr: "Nature", en: "Kind", desc: "Donnée de site, donnée client, donnée fournisseur, hypothèse d'étude, hypothèse d'exploitation."}
      - {id: dataOwner,      type: string, fr: "Détenteur de la donnée", en: "Data owner"}
      - {id: validationMethod, type: richtext, fr: "Mode de confirmation", en: "Confirmation method"}
      - {id: consequenceIfInvalid, type: richtext, fr: "Conséquence si infirmée", en: "Consequence if invalid"}
      - {id: confirmationDueDate, type: date, fr: "Échéance de confirmation", en: "Confirmation due date"}
      - {id: safetyRelevant, type: "enum:yesNoTbd", fr: "Pertinente pour la sûreté", en: "Safety relevant"}

  # --------------------------------------------------------------------------
  # Famille ARCHITECTURE (RFLP)
  # --------------------------------------------------------------------------
  - id: operationalScenario
    family: architecture
    fr: "Scénario opérationnel"
    en: "Operational scenario"
    color: "#43A047"
    workflow: wfArchitecture
    desc: "Cas d'utilisation / séquence d'exploitation, d'intervention ou de manutention (ConOps)."
    fieldSets: [common]
    fields:
      - {id: scenarioType, type: "enum:scenarioType", fr: "Type", en: "Type", required: true}
      - {id: plantStates,  type: "enum:plantState", multi: true, fr: "États d'exploitation", en: "Plant states"}
      - {id: actors,       type: richtext, fr: "Acteurs", en: "Actors"}
      - {id: preconditions, type: richtext, fr: "Préconditions", en: "Preconditions"}
      - {id: estimatedDuration, type: duration, fr: "Durée estimée", en: "Estimated duration"}
      - {id: doseEstimate, type: float, fr: "Dose collective prévisionnelle (H.mSv)", en: "Collective dose estimate (man.mSv)"}

  - id: function
    family: architecture
    fr: "Fonction"
    en: "Function"
    color: "#2E7D32"
    workflow: wfArchitecture
    desc: "Élément de l'architecture fonctionnelle (R-F-L-P), hiérarchisé par lien parent."
    fieldSets: [common, functionSafety]
    fields:
      - {id: functionLevel, type: "enum:functionLevel", fr: "Niveau", en: "Level", required: true}
      - {id: functionType,  type: "enum:functionType", fr: "Type", en: "Type", required: true}
      - {id: performanceSummary, type: richtext, fr: "Performances attendues", en: "Expected performance"}
      - {id: modelElementId, type: string, fr: "ID élément de modèle (MBSE)", en: "Model element ID (MBSE)", desc: "UUID Capella / SysML si synchronisé."}

  - id: logicalComponent
    family: architecture
    fr: "Élément logique"
    en: "Logical component"
    color: "#558B2F"
    workflow: wfArchitecture
    desc: "Système élémentaire, train/division, système C-C ou module logique indépendant de la technologie."
    fieldSets: [common]
    fields:
      - {id: logicalType, type: "enum:logicalType", fr: "Type", en: "Type", required: true}
      - {id: systemCode,  type: string, fr: "Code système (trigramme / KKS)", en: "System code (KKS / trigram)"}
      - {id: functionCategory, type: "enum:functionCategory", fr: "Catégorie de fonction la plus élevée", en: "Highest function category"}
      - {id: icSystemClass, type: "enum:icSystemClass", fr: "Classe système C-C", en: "I&C system class"}
      - {id: modelElementId, type: string, fr: "ID élément de modèle (MBSE)", en: "Model element ID (MBSE)"}

  - id: physicalComponent
    family: architecture
    fr: "Élément physique (SSC)"
    en: "Physical component (SSC)"
    color: "#33691E"
    workflow: wfArchitecture
    desc: >
      Proxy ALM d'un élément du PBS : bâtiment, système, équipement, composant,
      article logiciel, outillage, assemblage combustible. La nomenclature
      maître reste dans le PLM ; l'ALM porte classement, exigences et V&V.
    fieldSets: [common, sscClassification]
    fields:
      - {id: componentNature,  type: "enum:componentNature", fr: "Nature", en: "Nature", required: true}
      - {id: pbsLevel,         type: "enum:pbsLevel", fr: "Niveau PBS", en: "PBS level"}
      - {id: functionalTag,    type: string, fr: "Repère fonctionnel (KKS / ECS)", en: "Functional tag (KKS / ECS)"}
      - {id: plmItemId,        type: string, fr: "Identifiant PLM", en: "PLM item ID"}
      - {id: plmRevision,      type: string, fr: "Révision PLM", en: "PLM revision"}
      - {id: plantLocation,    type: string, fr: "Bâtiment / local", en: "Building / room"}
      - {id: supplier,         type: string, fr: "Fournisseur / fabricant", en: "Supplier / manufacturer"}
      - {id: isConfigurationItem, type: boolean, fr: "Article de configuration", en: "Configuration item"}
      - {id: qualificationStatus, type: "enum:qualificationStatus", fr: "Statut de qualification", en: "Qualification status"}
      - {id: designLifeYears,  type: integer, fr: "Durée de vie de conception (ans)", en: "Design life (years)"}
      - {id: ageingMechanisms, type: "enum:ageingMechanism", multi: true, fr: "Mécanismes de vieillissement", en: "Ageing mechanisms"}
      - {id: modelElementId,   type: string, fr: "ID élément de modèle (MBSE)", en: "Model element ID (MBSE)"}

  - id: interface
    family: architecture
    fr: "Interface"
    en: "Interface"
    color: "#00897B"
    workflow: wfInterface
    desc: >
      Entrée du registre d'interfaces (ICD) entre deux éléments (côté A / côté B).
      Les liens Polarion ne portant pas d'attributs, les données échangées sont
      portées par l'interface elle-même.
    fieldSets: [common]
    fields:
      - {id: interfaceType,   type: "enum:interfaceType", multi: true, fr: "Type(s)", en: "Type(s)", required: true}
      - {id: interfaceScope,  type: "enum:interfaceScope", fr: "Portée", en: "Scope", required: true}
      - {id: sideAOwner,      type: string, fr: "Responsable côté A", en: "Side A owner"}
      - {id: sideBOwner,      type: string, fr: "Responsable côté B", en: "Side B owner"}
      - {id: interfaceData,   type: richtext, fr: "Données échangées (charges, signaux, débits...)", en: "Exchanged data (loads, signals, flows...)"}
      - {id: icdReference,    type: string, fr: "Référence ICD", en: "ICD reference"}
      - {id: contractualInterface, type: boolean, fr: "Interface contractuelle", en: "Contractual interface"}
