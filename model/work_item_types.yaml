      - {id: ncSeverity,       type: "enum:ncSeverity", fr: "Gravité", en: "Severity", required: true}
      - {id: affectsEip,       type: "enum:yesNoTbd", fr: "Affecte un EIP / exigence définie", en: "Affects EIP / defined requirement", required: true}
      - {id: importantDeviation, type: "enum:yesNoTbd", fr: "Écart important (au sens du référentiel)", en: "Important deviation"}
      - {id: requirementViolated, type: richtext, fr: "Exigence / référentiel non respecté", en: "Violated requirement"}
      - {id: quantityAffected, type: integer, fr: "Quantité concernée", en: "Quantity affected"}
      - {id: serialNumbers,    type: string, fr: "N° de série / lots", en: "Serial / lot numbers"}
      - {id: supplier,         type: string, fr: "Fournisseur", en: "Supplier"}
      - {id: containmentAction, type: richtext, fr: "Action conservatoire", en: "Containment action"}
      - {id: ncDisposition,    type: "enum:ncDisposition", fr: "Traitement proposé", en: "Proposed disposition"}
      - {id: dispositionJustification, type: richtext, fr: "Justification du traitement", en: "Disposition justification", requiredAt: dispositionProposed}
      - {id: customerApprovalRequired, type: "enum:yesNoTbd", fr: "Accord client requis", en: "Customer approval required"}
      - {id: customerDecisionReference, type: string, fr: "Référence décision client", en: "Customer decision reference"}
      - {id: authorityNotificationRequired, type: "enum:yesNoTbd", fr: "Information autorité / organisme requise", en: "Authority notification required"}
      - {id: authorityReference, type: string, fr: "Référence autorité / organisme", en: "Authority reference"}
      - {id: significantEventType, type: "enum:significantEventType", fr: "Événement significatif (exploitant)", en: "Significant event (licensee)"}
      - {id: cfsiSuspected,    type: "enum:yesNoTbd", fr: "Suspicion CFSI", en: "CFSI suspected", required: true}
      - {id: part21Evaluation, type: "enum:yesNoTbd", fr: "Évaluation 10 CFR 21 requise (US)", en: "10 CFR 21 evaluation required (US)"}
      - {id: rootCauseCategory, type: "enum:rootCauseCategory", fr: "Cause racine", en: "Root cause"}
      - {id: rootCauseDescription, type: richtext, fr: "Analyse de cause", en: "Root cause analysis"}
      - {id: costOfNonQuality, type: currency, fr: "Coût de non-qualité", en: "Cost of non-quality"}

  - id: waiver
    family: change
    fr: "Dérogation / concession"
    en: "Waiver / concession"
    color: "#C2185B"
    workflow: wfWaiver
    creationMode: manual
    desc: "Autorisation formelle de s'écarter d'une exigence (avant réalisation) ou d'accepter un produit non conforme (après)."
    fieldSets: [common]
    fields:
      - {id: waiverType,       type: "enum:waiverType", fr: "Type", en: "Type", required: true}
      - {id: waiverJustification, type: richtext, fr: "Justification technique", en: "Technical justification", required: true}
      - {id: affectsEip,       type: "enum:yesNoTbd", fr: "Affecte un EIP / exigence définie", en: "Affects EIP / defined requirement", required: true}
      - {id: effectivity,      type: string, fr: "Portée (tranches, séries, durée)", en: "Scope (units, series, duration)"}
      - {id: expiryDate,       type: date, fr: "Date d'expiration", en: "Expiry date"}
      - {id: customerApprovalReference, type: string, fr: "Référence accord client", en: "Customer approval reference"}
      - {id: authorityApprovalReference, type: string, fr: "Référence accord autorité / organisme", en: "Authority approval reference"}

  - id: technicalIssue
    family: change
    fr: "Problème technique / fortuit"
    en: "Technical issue / emergent issue"
    color: "#BF360C"
    workflow: wfTechnicalIssue
    creationMode: manual
    desc: >
      Point d'entrée des affaires à cycle court (fortuit en arrêt de tranche,
      indication ISI, problème générique palier, question client). Workflow
      express mais socle non négociable conservé.
    fieldSets: [common]
    fields:
      - {id: issueCategory,    type: "enum:issueCategory", fr: "Catégorie", en: "Category", required: true}
      - {id: urgency,          type: "enum:urgency", fr: "Urgence", en: "Urgency", required: true}
      - {id: site,             type: "enum:frenchSite", fr: "Site", en: "Site"}
      - {id: affectedUnit,     type: "enum:plantUnit", fr: "Tranche concernée", en: "Affected unit"}
      - {id: outageType,       type: "enum:outageType", fr: "Type d'arrêt", en: "Outage type"}
      - {id: outageCriticalPath, type: boolean, fr: "Sur le chemin critique de l'arrêt", en: "On outage critical path"}
      - {id: customerRequestReference, type: string, fr: "Référence demande client", en: "Customer request reference"}
      - {id: detectedOn,       type: date, fr: "Date de détection", en: "Detection date"}
      - {id: responseDueDate,  type: datetime, fr: "Échéance de réponse", en: "Response due"}
      - {id: solutionType,     type: "enum:solutionType", fr: "Type de solution", en: "Solution type"}
      - {id: safetyImpact,     type: "enum:yesNoTbd", fr: "Impact sûreté", en: "Safety impact", required: true}
      - {id: affectsEip,       type: "enum:yesNoTbd", fr: "Affecte un EIP", en: "Affects EIP"}
      - {id: espnImpact,       type: "enum:yesNoTbd", fr: "Concerne un ESPN", en: "Relates to ESPN"}
      - {id: genericImpact,    type: "enum:yesNoTbd", fr: "Caractère générique (palier / flotte)", en: "Generic (series / fleet)"}
      - {id: lessonsLearnedCaptured, type: boolean, fr: "REX capitalisé", en: "Lessons learned captured"}

  # --------------------------------------------------------------------------
  # Famille PROJET / LIVRABLES / REVUES
  # --------------------------------------------------------------------------
  - id: deliverable
    family: project
    fr: "Livrable / document"
    en: "Deliverable / document"
    color: "#455A64"
    workflow: wfDeliverable
    desc: >
      Référence d'un document (GED = système d'archivage de référence) ou d'un
      document produit depuis un LiveDoc. Porte le cycle de visa client.
    fieldSets: [common, documentReference]
    fields:
      - {id: deliverableType,  type: "enum:deliverableType", fr: "Type", en: "Type", requiredAt: "soumission"}
      - {id: customerVisa,     type: "enum:customerVisa", fr: "Visa client", en: "Customer visa"}
      - {id: contractualDueDate, type: date, fr: "Date contractuelle", en: "Contractual date"}
      - {id: forecastDate,     type: date, fr: "Date prévisionnelle", en: "Forecast date"}
      - {id: docAuthor,        type: user, fr: "Rédacteur", en: "Author"}
      - {id: docVerifier,      type: user, fr: "Vérificateur", en: "Verifier"}
      - {id: docApprover,      type: user, fr: "Approbateur", en: "Approver"}
      - {id: language,         type: "enum:language", fr: "Langue", en: "Language"}
      - {id: liveDocPath,      type: string, fr: "LiveDoc source (chemin)", en: "Source LiveDoc (path)"}
      - {id: sdrlReference,    type: string, fr: "Ligne SDRL / liste des documents contractuels", en: "SDRL / CDRL line reference"}
      - {id: submittalPurpose, type: "enum:submittalPurpose", fr: "Objet de la transmission", en: "Submittal purpose"}

  - id: review
    family: project
    fr: "Revue / jalon"
    en: "Review / gate"
    color: "#37474F"
    workflow: wfReview
    creationMode: manual
    desc: "Revue formelle (SRR, PDR, CDR, TRR, revue de sûreté...) ou jalon de décision."
    fieldSets: [common]
    fields:
      - {id: reviewType,     type: "enum:reviewType", fr: "Type", en: "Type", required: true}
      - {id: reviewDate,     type: date, fr: "Date", en: "Date", required: true}
      - {id: reviewScope,    type: richtext, fr: "Périmètre et documents d'entrée", en: "Scope and entry documents"}
      - {id: entryCriteria,  type: richtext, fr: "Critères d'entrée", en: "Entry criteria"}
      - {id: exitCriteria,   type: richtext, fr: "Critères de sortie", en: "Exit criteria"}
      - {id: participants,   type: richtext, fr: "Participants", en: "Participants"}
      - {id: reviewDecision, type: "enum:reviewDecision", fr: "Décision", en: "Decision"}
      - {id: minutesReference, type: string, fr: "Référence du compte rendu", en: "Minutes reference"}

  - id: reviewFinding
    family: project
    fr: "Remarque de revue / observation client"
    en: "Review finding / customer comment"
    color: "#546E7A"
    workflow: wfReviewFinding
    desc: "Remarque issue d'une revue ou d'une fiche d'observations client ; levée tracée."
    fieldSets: [common]
    fields:
      - {id: findingSeverity, type: "enum:findingSeverity", fr: "Gravité", en: "Severity", requiredAt: "soumission"}
      - {id: findingOrigin,   type: "enum:findingOrigin", fr: "Émetteur", en: "Originator", requiredAt: "soumission"}
      - {id: documentLocation, type: string, fr: "Localisation (§, page)", en: "Location (§, page)"}
      - {id: findingResponse, type: richtext, fr: "Réponse", en: "Response", requiredAt: answered}
      - {id: responseAccepted, type: "enum:yesNoTbd", fr: "Réponse acceptée par l'émetteur", en: "Response accepted by originator"}

  - id: action
    family: project
    fr: "Action"
    en: "Action"
    color: "#78909C"
    workflow: wfAction
    creationMode: manual
    desc: "Action (conservatoire, corrective, préventive, de revue, point ouvert, surveillance, mise en œuvre)."
    fieldSets: [common]
    fields:
      - {id: actionType,         type: "enum:actionType", fr: "Type", en: "Type", required: true}
      - {id: closureEvidence,    type: string, fr: "Preuve de réalisation", en: "Closure evidence", requiredAt: done}
      - {id: effectivenessCheck, type: richtext, fr: "Vérification d'efficacité", en: "Effectiveness check"}

  - id: workPackage
    family: project
    fr: "Lot de travaux (UO réalisatrice)"
    en: "Work package (performing unit)"
    color: "#5D4037"
    workflow: wfWorkPackage
    creationMode: manual
    desc: >
      Contrat interne entre le projet (BU, maîtrise d'ouvrage) et une UO réalisatrice
      (usine, centre d'ingénierie, filiale, partenaire, fournisseur). Porte le périmètre,
      les données d'entrée, les livrables attendus et les critères de remise. Les
      artefacts produits sont rattachés au lot par le lien 'inWorkPackage'. Réponse à
      l'organisation matricielle BU × UO sans multiplier les projets (ajout v0.3).
    fieldSets: [common]
    fields:
      - {id: workPackageType,  type: "enum:workPackageType", fr: "Nature", en: "Type", required: true}
      - {id: wpManager,        type: user, fr: "Responsable de lot (UO)", en: "Work package manager"}
      - {id: workPackageScope, type: richtext, fr: "Périmètre et données d'entrée", en: "Scope and inputs", requiredAt: agreed}
      - {id: handoverCriteria, type: richtext, fr: "Critères de remise / réception", en: "Handover / acceptance criteria", requiredAt: agreed}
      - {id: internalOrderReference, type: string, fr: "Commande interne / OTP", en: "Internal order reference"}
      - {id: budgetHours,      type: float, fr: "Budget (heures)", en: "Budget (hours)"}
      - {id: progressPercent,  type: float, computed: true, fr: "Avancement (%) calculé", en: "Progress (%) computed", desc: "Part des livrables rattachés à l'état définitif / approuvé."}

  # --------------------------------------------------------------------------
  # Famille BIBLIOTHÈQUE
  # --------------------------------------------------------------------------
  - id: term
    family: library
    fr: "Terme du glossaire"
    en: "Glossary term"
    color: "#9E9E9E"
    workflow: wfLibraryItem
    desc: "Terme / acronyme multilingue (FR / EN / DE) – référentiel terminologique commun."
    fieldSets: []
    fields:
      - {id: acronym,      type: string, fr: "Acronyme", en: "Acronym"}
      - {id: termFr,       type: string, fr: "Terme (FR)", en: "Term (FR)"}
      - {id: termEn,       type: string, fr: "Terme (EN)", en: "Term (EN)"}
      - {id: termDe,       type: string, fr: "Terme (DE)", en: "Term (DE)"}
      - {id: definitionSource, type: string, fr: "Source de la définition", en: "Definition source"}
      - {id: deprecatedSynonyms, type: string, fr: "Synonymes déconseillés", en: "Deprecated synonyms"}
      - {id: transitionNote,     type: text, fr: "Motif de la dernière transition", en: "Last transition note"}

  # --------------------------------------------------------------------------
  # Famille EFFECTIVITÉ / REX (ajout v0.2 – revue critique)
  # --------------------------------------------------------------------------
  - id: unitDeployment
    family: change
    fr: "Déploiement par tranche / cycle (effectivité)"
    en: "Unit / cycle deployment (effectivity)"
    color: "#3949AB"
    workflow: wfUnitDeployment
    creationMode: manual
    desc: >
      Enregistrement de l'application d'une modification, d'une prescription,
      d'une solution générique ou d'un dossier de recharge sur UNE tranche (et
      un cycle / un arrêt). Les liens Polarion ne portant pas d'attributs, le
      statut par tranche ne peut pas être porté par le seul champ
      applicableUnits : un enregistrement enfant par tranche est nécessaire
      (palier de 20 à 32 tranches déployé sur 10 ans, 6 tranches EPR2,
      recharges tranche × cycle, outillage engagé sur un site).
    fieldSets: [common]
    fields:
      - {id: deploymentUnit,   type: "enum:plantUnit", fr: "Tranche", en: "Unit", required: true}
      - {id: deploymentSite,   type: "enum:frenchSite", fr: "Site", en: "Site"}
      - {id: cycleNumber,      type: string, fr: "Cycle (recharge)", en: "Cycle (reload)"}
      - {id: outageType,       type: "enum:outageType", fr: "Type d'arrêt", en: "Outage type"}
      - {id: outageReference,  type: string, fr: "Référence de l'arrêt (ex. VD4 2028)", en: "Outage reference"}
      - {id: plannedDate,      type: date, fr: "Date prévue", en: "Planned date"}
      - {id: actualDate,       type: date, fr: "Date de réalisation", en: "Actual date"}
      - {id: deviationsNoted,  type: "enum:yesNoTbd", fr: "Écarts constatés au déploiement", en: "Deviations noted"}
      - {id: deploymentNotes,  type: richtext, fr: "Constats / adaptations locales", en: "Notes / local adaptations"}

  - id: lessonLearned
    family: project
    fr: "Fiche REX (retour d'expérience)"
    en: "Lesson learned (OE)"
    color: "#00695C"
    workflow: wfLessonLearned
    creationMode: manual
    desc: >
      Capitalisation d'un retour d'expérience (fortuit, écart, anomalie,
      revue, intervention, REX externe) réutilisable entre projets et BU.
      Publiée dans LIB-PROCESS (requête transverse) ; la REX générique peut
      déclencher une évolution de bibliothèque ou de gabarit.
    fieldSets: [common]
    fields:
      - {id: lessonCategory,   type: "enum:lessonCategory", fr: "Catégorie", en: "Category", required: true}
      - {id: lessonContext,    type: richtext, fr: "Contexte / faits", en: "Context / facts"}
      - {id: lessonRecommendation, type: richtext, fr: "Recommandation", en: "Recommendation", requiredAt: validated}
      - {id: genericImpact,    type: "enum:yesNoTbd", fr: "Portée générique (palier / flotte / produit)", en: "Generic scope"}
      - {id: targetAssets,     type: string, fr: "Référentiels à faire évoluer (bibliothèque, gabarit, procédure)", en: "Assets to update"}

