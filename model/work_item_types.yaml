      - {id: vvStage,           type: "enum:vvStage", fr: "Étape", en: "Stage", requiredAt: "soumission"}
      - {id: vvLevel,           type: "enum:reqLevel", fr: "Niveau", en: "Level"}
      - {id: acceptanceCriteria, type: richtext, fr: "Critères d'acceptation", en: "Acceptance criteria", requiredAt: "soumission"}
      - {id: preconditions,     type: richtext, fr: "Préconditions / configuration", en: "Preconditions / configuration"}
      - {id: testSteps,         type: testSteps, fr: "Étapes", en: "Test steps"}
      - {id: testEnvironment,   type: "enum:testEnvironment", fr: "Environnement", en: "Environment"}
