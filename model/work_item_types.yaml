      - {id: systemEffect,     type: richtext, fr: "Effet système / installation", en: "System / plant effect"}
      - {id: failureCause,     type: richtext, fr: "Cause", en: "Cause"}
      - {id: severityRating,   type: integer, fr: "Gravité G (1-10)", en: "Severity S (1-10)"}
      - {id: occurrenceRating, type: integer, fr: "Occurrence O (1-10)", en: "Occurrence O (1-10)"}
      - {id: detectionRating,  type: integer, fr: "Détection D (1-10)", en: "Detection D (1-10)"}
      - {id: rpn,              type: integer, computed: true, fr: "Criticité (G×O×D)", en: "RPN (S×O×D)"}
      - {id: actionPriority,   type: "enum:actionPriority", fr: "Priorité d'action", en: "Action priority"}
      - {id: detectionMeans,   type: richtext, fr: "Moyens de détection", en: "Detection means"}
      - {id: revisedSeverity,  type: integer, fr: "G après actions", en: "S after actions"}
      - {id: revisedOccurrence, type: integer, fr: "O après actions", en: "O after actions"}
      - {id: revisedDetection, type: integer, fr: "D après actions", en: "D after actions"}

