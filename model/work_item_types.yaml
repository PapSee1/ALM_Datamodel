      - {id: independenceLevel, type: "enum:independenceLevel", fr: "Indépendance requise", en: "Required independence"}
      - {id: qualificationStandard, type: string, fr: "Norme de qualification", en: "Qualification standard", desc: "Ex. IEC/IEEE 60780-323, IEC/IEEE 60980-344, IEC 62003."}
      - {id: evidenceReference, type: string, fr: "Référence de la preuve (PV, note)", en: "Evidence reference"}
      - {id: estimatedDuration, type: duration, fr: "Durée estimée", en: "Estimated duration"}
      - {id: regressionRequired, type: boolean, fr: "À rejouer en non-régression", en: "Regression required"}
      - {id: requiredHabilitation, type: "enum:habilitationDomain", fr: "Habilitation requise du vérificateur / approbateur", en: "Qualification required to verify / approve"}
      - {id: lastResult,        type: "enum:testResult", computed: true, fr: "Dernier résultat (calculé)", en: "Last result (computed)"}

  - id: anomaly
    family: vv
    fr: "Fiche d'anomalie (V&V)"
    en: "Anomaly report (V&V)"
    color: "#FF6F00"
    workflow: wfAnomaly
    desc: "Anomalie détectée en V&V (logiciel, matériel, spécification d'essai). Les écarts produit relèvent de nonConformance."
    fieldSets: [common]
    fields:
